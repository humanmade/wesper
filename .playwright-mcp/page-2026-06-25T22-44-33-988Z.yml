      - generic [ref=e319]:
        - generic [ref=e320]:
          - heading "Why we built it." [level=2] [ref=e321]
          - paragraph [ref=e322]:
            - text: "It is the read half of the agentic-WordPress loop: read the site (Wesper) → author native blocks ("
            - link "Block Runner" [ref=e323] [cursor=pointer]:
              - /url: /block-runner
            - text: ) → wire them to the site’s real data (the binding pass).
          - paragraph [ref=e324]: Block Runner already reached into WordPress for theme tokens through a built-in resolver. Wesper is that pattern lifted out, widened to the whole world model — binding sources, fields, registry, patterns, abilities — and made a reusable artifact every consumer can share, instead of each agent re-deriving brittle introspection of its own.
          - paragraph [ref=e325]:
            - text: We built it because we needed it ourselves, to run autonomous optimisation experiments on
            - link "Accelerate" [ref=e326] [cursor=pointer]:
              - /url: /?utm_source=wesper&utm_medium=referral&utm_campaign=open-source
            - text: ", then open-sourced it as the read primitive the ecosystem was missing — so every tool in the pipeline can trust the site it is writing to."
