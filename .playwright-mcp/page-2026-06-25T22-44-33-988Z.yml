      - generic [ref=e149]:
        - generic [ref=e150]:
          - heading "Read once, hand off everywhere." [level=2] [ref=e151]
          - paragraph [ref=e152]: Collect a site into a manifest, then let any consumer read one known shape — instead of every agent re-deriving brittle introspection of its own.
          - paragraph [ref=e153]: A hand-authored context file goes stale the moment the site moves on — and nothing tells the reader. Every Wesper read is stamped with a content hash, so a stale manifest is something you diff and catch in CI, never a silent wrong answer waiting to ship.
